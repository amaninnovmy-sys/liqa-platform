name: Apply reviewed Next security patch
on:
  push:
    branches: ['feat/secure-office-console']
    paths: ['.github/workflows/retain-verified-lock.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'amaninnovmy-sys/liqa-platform' && github.ref == 'refs/heads/feat/secure-office-console'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-office-console
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed patched framework version
        run: npm install --save-exact --ignore-scripts next@16.3.8
      - name: Check resolved patch and advisory status
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("package-lock.json")); assert.equal(p.dependencies.next,"16.3.8"); assert.equal(l.packages["node_modules/next"].version,"16.3.8"); assert.deepEqual(p.dependencies,l.packages[""].dependencies);'
          npm audit --audit-level=high
      - name: Commit reviewed patch and exact dependency lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: update Next.js to patched 16.3.8 with exact dependency lock'
          git push origin HEAD:feat/secure-office-console
