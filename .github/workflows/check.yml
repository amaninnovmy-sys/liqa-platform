name: LIQA checks
on:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'tests/**', 'public/**', 'package*.json', 'next.config.mjs', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liqa-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts
      - name: Domain checks
        run: npm run check
      - name: Build static demo
        run: npm run build
      - name: Export preview and resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: liqa-demo-build
          path: |
            out/
            package-lock.json
          retention-days: 14
