name: LIQA checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liqa-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LIQA_BACKEND_ENABLED: 'false'
      PGPASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: liqa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d liqa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies (block high and critical advisories)
        run: |
          set +e
          npm audit --json --audit-level=high > npm-audit.json
          result=$?
          cat npm-audit.json
          exit "$result"
      - name: Domain and input tests
        run: npm run check
      - name: Database isolation and consent tests (disposable service only)
        run: |
          psql -h 127.0.0.1 -U postgres -d liqa_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d liqa_test -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h 127.0.0.1 -U postgres -d liqa_test -v ON_ERROR_STOP=1 -f tests/database-rls.sql
      - name: Build server application
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser journeys and screenshots
        run: npm run test:browser
      - name: Archive source with exact resolved dependencies
        if: always()
        run: git archive --format=tar.gz HEAD -o liqa-source.tar.gz
      - name: Export verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqa-verification
          path: |
            liqa-source.tar.gz
            package-lock.json
            npm-audit.json
            previews/
            playwright-report/
            test-results/
          retention-days: 14
